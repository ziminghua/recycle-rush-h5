name: Bootstrap vertical slice

on:
  push:
    branches:
      - agent/playable-vertical-slice
    paths:
      - .bootstrap/project.tar.gz.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-vertical-slice
          fetch-depth: 0
      - name: Verify and unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/project.tar.gz.b64 > /tmp/recycle-rush-src.tar.gz
          echo "265d28143ed38a38fc04c5f5592ec452b956b234c25e6f969cf48eb7ec79316c  /tmp/recycle-rush-src.tar.gz" | sha256sum --check -
          tar -xzf /tmp/recycle-rush-src.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build playable vertical slice"
          git push origin HEAD:agent/playable-vertical-slice

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#102738" />
  <title>Recycle Rush: Idle Factory</title>
  <style>html,body{width:100%;height:100%;margin:0;background:#07151f;color:#fff;font-family:system-ui;display:grid;place-items:center}.loading{font-weight:800;letter-spacing:.04em}</style>
</head>
<body>
  <div class="loading">Loading Recycle Rush…</div>
  <script>
    (async () => {
      const files = ['game-00.txt', 'game-01.txt', 'game-02.txt', 'game-03.txt'];
      const encoded = (await Promise.all(files.map((name) => fetch(`./payload/${name}`).then((response) => {
        if (!response.ok) throw new Error(`Failed to load ${name}`);
        return response.text();
      })))).join('');
      const binary = atob(encoded);
      const compressed = Uint8Array.from(binary, (character) => character.charCodeAt(0));
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      document.body.innerHTML = `<pre style="padding:24px;white-space:pre-wrap">${error.stack || error}</pre>`;
    });
  </script>
</body>
</html>

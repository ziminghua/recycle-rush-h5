<script src="./ui-live.js?v=20260806-1540"></script>
<script>
(async()=>{
 const version='20260806-1540';
 const files=['ui-img-0.txt','ui-img-1p0.txt','ui-img-1p1.txt','ui-img-1p2.txt','ui-img-1p3.txt','ui-img-1p4.txt','ui-img-1b.txt','ui-img-1c.txt','ui-img-1d.txt','ui-img-2.txt','ui-img-3.txt','ui-img-4.txt','ui-img-5.txt','ui-img-6.txt','ui-img-7.txt'];
 const parts=await Promise.all(files.map(n=>fetch(`./payload/${n}?v=${version}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`加载失败: ${n}`);return r.text();})));
 const art=document.getElementById('art');
 await new Promise((resolve,reject)=>{art.onload=resolve;art.onerror=()=>reject(new Error('图片数据解码失败'));art.src='data:image/webp;base64,'+parts.join('');});
 if(art.naturalWidth!==540||art.naturalHeight!==960)throw new Error(`图片尺寸异常: ${art.naturalWidth}×${art.naturalHeight}`);
 if(!window.RecycleRush)throw new Error('游戏逻辑加载失败');
 window.RecycleRush.boot();
 window.RecycleRushUI?.start();
})().catch(err=>{document.body.innerHTML=`<pre style="color:white;padding:20px;white-space:pre-wrap">${err.stack||err}</pre>`;});
</script>

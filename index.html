<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#102738" />
  <title>Recycle Rush: Idle Factory</title>
  <style>html,body{width:100%;height:100%;margin:0;background:#07151f;color:#fff;font-family:system-ui;display:grid;place-items:center}.loading{font-weight:800;letter-spacing:.04em}</style>
</head>
<body>
  <div class="loading">Loading Recycle Rush…</div>
  <script>
    (async () => {
      const files = ['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt'];
      const parts = await Promise.all(files.map((name) => fetch(`./payload/${name}`).then((response) => {
        if (!response.ok) throw new Error(`Failed to load ${name}`);
        return response.text();
      })));
      const binary = atob(parts.join(''));
      const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
      const html = new TextDecoder().decode(bytes);
      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      document.body.innerHTML = `<pre style="padding:24px;white-space:pre-wrap">${error.stack || error}</pre>`;
    });
  </script>
</body>
</html>
